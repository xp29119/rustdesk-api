name: Account session validation

on:
  push:
    branches: [codex/secure-sessions-2.7]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: account-sessions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        go: ['1.23.10', '1.27.3']
    env:
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Download the pinned module graph and record checksums
        run: |
          GOFLAGS= go mod download all
          git diff --exit-code -- go.mod go.sum
          mkdir -p validation-results
          cp go.sum validation-results/go.sum
      - name: Targeted session and login-controller tests
        run: go test -race -count=1 ./service ./http/controller/api ./http/controller/admin
      - name: Compile the actual API executable
        run: |
          mkdir -p dist
          go build -trimpath -ldflags '-s -w' -o dist/apimain ./cmd/apimain.go
          git rev-parse HEAD > dist/SOURCE_COMMIT
          go version > dist/GO_VERSION
          sha256sum dist/apimain > dist/SHA256SUMS
      - name: Checkout the pinned existing admin frontend
        if: matrix.go == '1.27.3'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: lejianwen/rustdesk-api-web
          ref: 3998c2a9213fcd047252776d0f0db33e6717026c
          path: .admin-source
          persist-credentials: false
      - name: Setup the frontend build runtime
        if: matrix.go == '1.27.3'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
      - name: Build the original admin UI from its lockfile
        if: matrix.go == '1.27.3'
        working-directory: .admin-source
        run: |
          npm ci --include=dev --no-audit --no-fund
          NODE_ENV=production npm run build
          git diff --exit-code -- package.json package-lock.json
          test -s dist/index.html
          mkdir -p ../resources/admin
          cp -a dist/. ../resources/admin/
      - name: Real HTTP login, device and address-book smoke
        run: |
          set -o pipefail
          admin_args=()
          if [ "${{ matrix.go }}" = '1.27.3' ]; then admin_args+=(--with-admin); fi
          python3 validation/http-smoke.py --binary "$PWD/dist/apimain" --resources "$PWD/resources" "${admin_args[@]}" | tee validation-results/http-smoke.json
      - name: Package the API with its verified admin resources
        if: matrix.go == '1.27.3'
        run: |
          mkdir -p dist/resources
          cp -a resources/admin resources/i18n resources/templates resources/public dist/resources/
          printf '%s\n' '2.7-secure-sessions' > dist/resources/version
          cp LICENSE dist/LICENSE-api
          cp .admin-source/LICENSE dist/LICENSE-admin
          git -C .admin-source rev-parse HEAD > dist/ADMIN_SOURCE_COMMIT
          node --version > dist/NODE_VERSION
          printf '%s\n' 'Validated API and original admin UI candidate. Production configuration, TLS and real-client acceptance are still required. No database or credentials are included.' > dist/README.txt
          (cd dist && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum) > dist/SHA256SUMS
      - name: Check changed Go source formatting
        if: always()
        run: |
          mkdir -p validation-results
          gofmt -d service/user.go service/user_token_test.go http/controller/admin/login.go http/controller/admin/user.go http/controller/api/login.go http/controller/api/login_options_test.go http/controller/api/ouath.go > validation-results/gofmt.diff
          cat validation-results/gofmt.diff
          test ! -s validation-results/gofmt.diff
      - name: Upload session validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-validation-go${{ matrix.go }}-${{ github.sha }}
          path: validation-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload validated API candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-2.7-secure-sessions-linux-amd64-go${{ matrix.go }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
